name: "CodeQL"

on:
  push:
    branches: [ "main", "ocl-open-*" ]
  pull_request:
    branches: [ "main", "ocl-open-*" ]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze

    runs-on: ubuntu-24.04

    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:

      - name: Checkout opencl-clang sources for action files and config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}

      - name: Load LLVM config
        shell: bash
        run: grep -E '^[A-Z_]+=' .github/llvm-version.env >> "$GITHUB_ENV"

      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          llvm_major: ${{ env.LLVM_MAJOR }}
          apt_suffix: ${{ env.APT_SUFFIX }}

      - name: Build SPIRV-LLVM-Translator
        id: translator
        uses: ./.github/actions/build-translator
        with:
          ref: ${{ env.TRANSLATOR_REF }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build opencl-clang
        run: |
          mkdir build && cd build
          cmake ${{ github.workspace }} \
            -DPREFERRED_LLVM_VERSION="${{ env.LLVM_MAJOR }}.${{ env.LLVM_MINOR }}" \
            -DLLVMSPIRV_INCLUDED_IN_LLVM=OFF \
            -DSPIRV_TRANSLATOR_DIR=${{ steps.translator.outputs.install_dir }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: "/language:${{matrix.language}}"
