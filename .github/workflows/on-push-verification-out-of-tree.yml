# ===---
# Running on push & pull_request.
#   Builds opencl-clang out-of-tree against an apt-installed LLVM.
#   Per-branch versions come from .github/llvm-version.env.
# ===---

name: Build
run-name: '${{ github.event_name }}: ${{ github.base_ref }} ${{ github.ref_name }}' # github.base_ref null for 'on: push'

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - ocl-open-*
  pull_request:
    branches:
      - main
      - ocl-open-*
    types:
      - opened
      - reopened
      - synchronize       # commit pushed to the PR
      - ready_for_review  # moved from draft state

jobs:

  verify_default_branch:
    name: Out-of-tree Linux
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout opencl-clang sources for action files and config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load LLVM config
        shell: bash
        run: grep -E '^[A-Z_]+=' .github/llvm-version.env >> "$GITHUB_ENV"

      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          llvm_major: ${{ env.LLVM_MAJOR }}
          apt_suffix: ${{ env.APT_SUFFIX }}

      - name: Build SPIRV-LLVM-Translator
        id: translator
        uses: ./.github/actions/build-translator
        with:
          ref: ${{ env.TRANSLATOR_REF }}

      - name: Checkout opencl-clang sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: opencl-clang
          ref: ${{ github.ref }}

      - name: Build opencl-clang
        run: |
          mkdir build && cd build
          cmake ${{ github.workspace }}/opencl-clang \
            -DPREFERRED_LLVM_VERSION="${{ env.LLVM_MAJOR }}.${{ env.LLVM_MINOR }}" \
            -DLLVMSPIRV_INCLUDED_IN_LLVM=OFF \
            -DSPIRV_TRANSLATOR_DIR=${{ steps.translator.outputs.install_dir }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j $(nproc)
